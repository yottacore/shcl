# Pin the toolchain so every build/lint on any box uses the same rustc + clippy.
# Only rustup honors this; cicd prepends ~/.cargo/bin so cargo goes through rustup.
# Bump deliberately: change the version here, run the full pipeline, commit.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = [
	"x86_64-pc-windows-gnu",
	"aarch64-unknown-linux-gnu",
	"aarch64-pc-windows-gnullvm",
	"x86_64-unknown-freebsd",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]

# The dated nightly for the sanitizer and Miri runs (sanitize-rust.bash), which
# need -Z flags. rustup reads only the table above; the image, ci.yml and the
# script read this one. Bump it like the channel: change it, run the full
# pipeline, commit.
[nightly]
channel = "nightly-2026-10-16"
components = ["rust-src", "miri"]
