## Correctness gate only. Everything else (cross-compile, publish, artifacts)
## stays in the local pipeline: cicd/cicd.bash. One definition of "passing" -
## this just runs the engine's --ci mode.
##
## Not on dev pushes. A branch is built and tested before it merges there, so a
## hosted run per dev push was the same gate again at half an hour each. main
## still gets one, pull requests do, and `gh workflow run ci --ref dev` starts
## one by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    ## 25 was enough until the large-document gate; that adds several minutes of
    ## single-threaded parsing per binding, and a hosted runner is slower again.
    ## A normal run is about 38 minutes, and a slow tool install once pushed one past 45.
    timeout-minutes: 60
    steps:
      ## Actions by commit SHA (tag in the comment), so a moved tag cannot
      ## silently change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      ## rustup on the runner reads rust-toolchain.toml and fetches the pinned
      ## toolchain on first cargo call; keep "what passing means" in the engine.
      ## The go.mod directive is the CONSUMER floor (1.20), not the pipeline's
      ## toolchain: cicd's own `go -C` needs a current release. Pinned to a
      ## series rather than stable, because staticcheck has its own copy of
      ## the type checker and cannot read export data from a Go newer than the
      ## release it was cut against - stable rolling to 1.27 broke the lint
      ## stage here while the local gate, on 1.26, stayed green. Move this when
      ## the staticcheck pin in TOOL_PINS moves. (No go.sum - the binding is
      ## zero-dep, so the module cache is off.)
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: false
      ## Python binding is a zero-dep single file; pin the interpreter so a runner
      ## image bump can't silently shift float/coercion formatting under it.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      ## Lint-stage tools beyond the toolchains. ruff/mypy/cppcheck ride the
      ## setup-python interpreter; markdownlint via npm; PSScriptAnalyzer into
      ## the runner's preinstalled pwsh. Versions match cicd/config.bash
      ## TOOL_PINS, so CI and the local gate agree about what "passing" was
      ## tested against. Exception: the cppcheck wheel's own version is not the
      ## Cppcheck version it includes - package 1.5.1 bundles the 2.17.1 binary
      ## that TOOL_PINS checks for. Pin the package version here (it is
      ## CPPCHECK_WHEEL in config.bash; the binary version is not a package that
      ## exists), and keep the binary version in this comment: check-pins.bash
      ## reads both.
      ##
      ## shellcheck is preinstalled but at whatever version the image has,
      ## which is not the one the local gate runs - it warns about shapes newer
      ## releases stopped flagging, so a script can pass locally and fail here.
      ## Install the pinned version ahead of the image's copy on PATH.
      - run: |
          ## The prerelease packaging row in shell-regress needs a NSIS
          ## compiler, and the completion rows need zsh and bash-completion;
          ## without any of them the rows used to skip, which under the gate is
          ## now a failure. All unpinned on purpose: NSIS only has to compile
          ## the setup script, and the completion rows run the shipped
          ## completion, so the version a user's own shell would be is the
          ## right one to answer.
          ## zig builds the README's Zig example and Pillow loads the demo gif
          ## script for its output-order row. Both skips fail the gate too.
          ## The cross checks run under --ci since 20260920, and the first of
          ## them builds the C library and CLI for windows with mingw's gcc,
          ## which this image does not have.
          ## perf-gate counts write calls with strace, and cli-regress holds a
          ## stat with it for the Schema line FIFO swap.
          ## The stub-package rows build a .deb and an .rpm and read them back:
          ## dpkg-deb ships on the image, rpm does not, and nfpm is installed
          ## with the Go tools below.
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis zsh bash-completion gcc-mingw-w64-x86-64 strace rpm
          pip install ruff==0.15.22 mypy==2.3.0 cppcheck==1.5.1 build==1.5.0 pillow==11.1.0
          npm install -g markdownlint-cli2@0.23.1
          pwsh -NoProfile -Command 'Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser'
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          # sha256 of shellcheck-v0.11.0.linux.x86_64.tar.xz: a gating tool
          # installed over the image's copy gets the same integrity pin as the
          # SHA-pinned actions above - a swapped tarball must fail here.
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/zig-0.16.0.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig-0.16.0.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig-0.16.0.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      ## The supply-chain trio gates the lint stage and none of it ships on the
      ## image, and nfpm builds the stub packages shell-regress reads back.
      ## Versions match TOOL_PINS, same as everything above. cargo-deny
      ## comes as a prebuilt binary rather than a cargo install: building it
      ## from source costs minutes here and pulls a dependency tree the gate has
      ## no reason to compile.
      - run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz"
          # Same integrity pin the shellcheck tarball gets: a gating tool
          # fetched over the wire must fail here if the bytes ever change.
          echo "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cargo-deny-0.19.9-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            source/rust/target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'source/rust/Cargo.lock') }}
      ## cppcheck's result cache, which the lint line keeps in the git dir. A run
      ## with no C change restores an exact match, and any other starts from the
      ## last one; cppcheck checks each file's own key before it uses an entry.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .git/cppcheck-build
          key: cppcheck-${{ hashFiles('source/c/**', 'cicd/config.bash') }}
          restore-keys: cppcheck-
      ## The runner runs nothing else, so the gate gets every core rather than
      ## the half it leaves free on a workstation.
      - run: CPU_CAP="$(nproc)" cicd/cicd.bash --ci

  ## The go.mod directive promises consumers the library builds on that release,
  ## and the job above runs a current one, whose vet says nothing about a call
  ## that is newer than the directive. So the library's own tests, and vet over
  ## both modules, on the exact release go.mod names.
  go-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: source/go/go.mod
          cache: false
      - run: |
          go version
          cd source/go
          go vet ./...
          go test -count=1
          cd cmd
          go vet ./...

  ## The file tier is the only part of the library with real per-platform
  ## code - the publish step is a different path in all four bindings - and the
  ## job above runs none of it on windows. The python binding threw on every
  ## windows overwrite through a whole release without anything here noticing.
  ## So: the runners and the veneer smoke, on windows, and nothing else. The
  ## corpus goldens, crosscheck, large document and every lint gate stay above,
  ## where they are defined; this is not a second definition of passing.
  ##
  ## Nothing is installed beyond the toolchains. mingw's gcc ships on the image
  ## and MSVC has no <dirent.h> for the C runner to walk the corpus with, so gcc
  ## is the compiler; win-runners.bash names the tool if the image ever drops it.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    ## Git Bash. The runner script is the same one a person runs by hand there.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      ## rustup is preinstalled and reads rust-toolchain.toml, same as above.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            source/rust/target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'source/rust/Cargo.lock') }}
      - run: bash cicd/utility/win-runners.bash

  ## The macOS binary is cross-built on Linux in stage 6, where it cannot run,
  ## and the Mac on hand is Intel. So this builds it on Apple silicon with the
  ## stage 6 command itself, read out of config.bash, and runs its arm64 half:
  ## cli-regress, and crosscheck over the corpus against a plain debug build.
  ## The Rust tests run the corpus against the library here as well.
  ##
  ## Not under --ci, so a row this host has no device or tool for (/dev/full,
  ## strace, the page map) is skipped out loud rather than failed. GNU
  ## coreutils go first on PATH, since the gate scripts use timeout and
  ## stat -c. cargo-zigbuild is installed without its ziglang dependency, which
  ## it would take over the pinned zig below.
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: |
          ## /bin/bash is 3.2, no assoc arrays
          brew install coreutils bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          pip install --no-deps cargo-zigbuild==0.23.0
      ## A step of its own, so the sha256sum below is the GNU one added above.
      - run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/zig-aarch64-macos-0.16.0.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  /tmp/zig-aarch64-macos-0.16.0.tar.xz" | sha256sum -c -
          tar -xJf /tmp/zig-aarch64-macos-0.16.0.tar.xz -C /tmp
          echo "/tmp/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            source/rust/target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'source/rust/Cargo.lock') }}
      - run: |
          CPU_CAP="$(nproc)"
          export CPU_CAP
          cargo test --manifest-path source/rust/Cargo.toml
          cargo build --manifest-path source/rust/Cargo.toml
          art=""
          # shellcheck source=/dev/null
          source cicd/config.bash
          for t in "${CROSS_TARGETS[@]}"; do
            [[ "${t}" == *"|macos-universal|"* ]] || continue
            rest="${t#*|}"; rest="${rest#*|}"; art="${rest%%|*}"
            eval "${rest#*|}"
          done
          [[ -n "${art}" && -f "${art}" ]] || { echo "no macOS binary built: ${art}" >&2; exit 1; }
          lipo -archs "${art}"
          bash cicd/utility/crosscheck.bash --corpus project/conformance "rust|source/rust/target/debug/shcl" "macos|${art}"
          bash cicd/utility/cli-regress.bash "macos|${art}"
