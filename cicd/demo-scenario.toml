# Demo scenario for gen-demo-gif.py. The high-level demo script is
# cicd/demo/script.txt - edit that, then mirror it here. Each [[step]] types its
# show= line into the fake terminal, runs run= (default: show) for real, and shows
# the output. {prog} renders as the program name; {bin} runs as the tested binary
# path. pause= is the read time in seconds. Paths in run= are relative to the repo
# root (where cicd runs). Whole loop runs about 33 seconds including the 3 s
# black tail; the read-time pauses are what add up, and cutting them enough to
# finish under 30 s left the two screenfuls unreadable.

title = "shcl"
prog  = "shcl"
seed  = 7
font  = ["Monaspace Argon SemiBold"]
blankafter = false              # output shape is the point here - no padding line
                                # between it and the next prompt to misread

[[step]]
note  = "A messy config"
show  = "cat app.shcl"
run   = "cat cicd/demo/app.shcl"
scrollrate = 320                # a long listing; the read time is the pause, not the scroll
pause = 3.0

[[step]]
show  = "{prog} get --int app.shcl 'servers[web1].port'"
run   = "{bin} get --int cicd/demo/app.shcl 'servers[web1].port'"
pause = 1.2

[[step]]
note  = "Bad lines: skipped, not fatal"
show  = "{prog} check app.shcl"
run   = "{bin} check cicd/demo/app.shcl"
expect_exit = 6                 # the demo file has a deliberate bad line
pause = 1.6

[[step]]
note  = "Canonical fmt; nothing lost"
show  = "{prog} fmt app.shcl"
run   = "{bin} fmt cicd/demo/app.shcl"
scrollrate = 320
pause = 3.4
