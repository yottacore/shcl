# Backup excludes only this project has, on top of the publisher's own. Read
# from disk, so a backup run outside cicd leaves these out too.
# One rar pattern per line, no '-x' and no quoting.

# The C and Go CLI builds, the Python build dir, and the comparison tool's build.
*/source/c/shcl
*/source/go/shcl
*/source/python/build
*/comparison/target

# CodeQL's databases, a GB or so a run.
*/cicd/artifacts/codeql
